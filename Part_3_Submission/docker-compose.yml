services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in your environment}
    ports:
      - "1433:1433"
    volumes:
      - raceday_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s

  api:
    build:
      context: ../Part_2_Submission/RaceDay.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__EnsureCreated: "true"
      Database__SeedDemoData: "true"
      ConnectionStrings__RaceDayDb: "Server=sqlserver;Database=RaceDayDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      AzureBlobStorage__ConnectionString: ${AZURE_BLOB_CONNECTION_STRING:-}
      AzureBlobStorage__ContainerName: raceday-media
    ports:
      - "5100:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  mvc:
    build:
      context: ./RaceDay.Mvc
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: http://api:8080/
    ports:
      - "5101:8080"
    depends_on:
      - api

volumes:
  raceday_sql_data:
