name: RaceDay live UI evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_raceday_ui.py'
      - '.github/workflows/raceday-ui-evidence.yml'

permissions:
  contents: write

concurrency:
  group: raceday-ui-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-running-application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Start the real RaceDay application stack
        run: docker compose -f Part_3_Submission/docker-compose.yml up --detach --build
        env:
          SA_PASSWORD: LocalRaceDayC1!StrongPassword

      - name: Wait for API and MVC to become available
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail http://127.0.0.1:5100/swagger/v1/swagger.json >/dev/null \
              && curl --silent --show-error --fail http://127.0.0.1:5101/ >/dev/null; then
              echo "RaceDay API and MVC are responding."
              exit 0
            fi
            echo "Waiting for SQL Server, API and MVC (attempt ${attempt}/90)..."
            sleep 5
          done
          echo "RaceDay did not become ready in time."
          docker compose -f Part_3_Submission/docker-compose.yml ps
          docker compose -f Part_3_Submission/docker-compose.yml logs --no-color
          exit 1

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture screenshots from the running website and API
        run: python scripts/capture_raceday_ui.py
        env:
          RACEDAY_BASE_URL: http://127.0.0.1:5101
          RACEDAY_API_URL: http://127.0.0.1:5100

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raceday-live-ui-screenshots-${{ github.run_number }}
          path: docs/evidence/ui/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Commit genuine application screenshots to the repository
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/ui/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "docs: add screenshots of the running RaceDay application"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Show container logs if evidence capture fails
        if: failure()
        run: docker compose -f Part_3_Submission/docker-compose.yml logs --no-color
        env:
          SA_PASSWORD: LocalRaceDayC1!StrongPassword

      - name: Stop the temporary application stack
        if: always()
        run: docker compose -f Part_3_Submission/docker-compose.yml down -v
        env:
          SA_PASSWORD: LocalRaceDayC1!StrongPassword
